# ============================================================
#  CodeTime — автосборка EXE и публикация релиза
#
#  Как это работает:
#    1. Пушим тег версии:  git tag v1.6.0 && git push origin v1.6.0
#    2. GitHub сам собирает CodeTime.exe на Windows-облаке
#    3. Готовый exe автоматически прикрепляется к Release
#    4. Приложение CodeTime на ПК пользователя видит новый
#       релиз через GitHub API и обновляется по одной кнопке
# ============================================================

name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # UTF-8 режим: консоль раннера Windows по умолчанию в cp1252,
    # русские сообщения в print() падали с UnicodeEncodeError
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Проверяем, что тег v1.6.0 совпадает с APP_VERSION в codetime.py,
      # чтобы приложение всегда сверяло версию корректно
      - name: Verify tag matches APP_VERSION
        shell: bash
        run: |
          VER=$(python -c "import re; print(re.search(r\"APP_VERSION = '([^']+)'\", open('codetime.py', encoding='utf-8').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VER  tag=$TAG"
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с APP_VERSION=$VER в codetime.py. Обнови APP_VERSION и переделай тег."
            exit 1
          fi

      # Предохранитель: в v1.8.2 случайно уехал dashboard.html из 99 байт
      # (весь интерфейс превратился в одну строку JS). Больше не повторяем.
      - name: Verify dashboard.html integrity
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          p = 'dashboard.html'
          if not os.path.exists(p):
              sys.exit('::error::dashboard.html отсутствует — сборка прервана')
          size = os.path.getsize(p)
          if size < 50000:
              sys.exit('::error::dashboard.html подозрительно мал (%d байт) — файл повреждён, сборка прервана' % size)
          html = open(p, encoding='utf-8').read()
          ver = re.search(r"APP_VERSION = '([^']+)'", open('codetime.py', encoding='utf-8').read()).group(1)
          if ver not in html:
              sys.exit('::error::в dashboard.html нет версии %r — файл из другого релиза?' % ver)
          for probe in ('<!DOCTYPE html>', '</html>', '<script>', 'id="updateStatus"', 'id="installBtn"',
                        'class="sidenav"', 'id="sideBurger"', 'id="topTitle"', 'id="sideVersion"',
                        'id="chatMsgs"', 'id="teamRun"', 'id="nplanList"', 'id="njournalText"',
                        'function hlCode', 'function mdRender', 'c-ava', 'md-tasks', 'm-meta'):
              if probe not in html:
                  sys.exit('::error::в dashboard.html нет обязательного фрагмента %r — файл повреждён' % probe)
          print('dashboard.html OK: %d байт, версия %s, все фрагменты на месте' % (size, ver))
          PY

      # Наставник (v1.9.0): модуль обязан лежать рядом — PyImporter возьмёт его в exe
      - name: Verify mentor.py presence
        shell: bash
        run: |
          python - <<'PY'
          import ast, sys
          try:
              src = open('mentor.py', encoding='utf-8').read()
              ast.parse(src)
          except Exception as e:
              sys.exit('::error::mentor.py отсутствует или не парсится: %r' % e)
          for probe in ('def api_chat', 'def api_status', 'def ensure_all', 'CodeTimeMentor',
                        'GEMINI_DEMO_KEY', 'last_review', 'notes.md', 'def _llm_chain'):
              if probe not in src:
                  sys.exit('::error::в mentor.py нет обязательного фрагмента %r' % probe)
          print('mentor.py OK: синтаксис чистый, все фрагменты на месте')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate icon.ico
        run: python make_icon.py

      # Та же команда, что в build_exe.bat — один-в-один
      - name: Build CodeTime.exe
        run: >
          pyinstaller --onefile --noconsole --name CodeTime --icon=icon.ico
          --add-data "dashboard.html;."
          --hidden-import pynput.keyboard
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          codetime.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeTime-windows
          path: dist/CodeTime.exe
          if-no-files-found: error

      # Тело релиза = сообщение коммита (generate_release_notes допишет
      # сравнение версий, приложение строку Full Changelog вырезает)
      - name: Prepare release body
        shell: bash
        run: git log -1 --format=%B > release_body.md

      # Прикрепляем exe к релизу (релиз создаётся автоматически для тега)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeTime.exe
          body_path: release_body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
